<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MooCraft - Sürüm Seçici</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      image-rendering: pixelated;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #242424;
      background-image: 
        linear-gradient(45deg, #1c1c1c 25%, transparent 25%), 
        linear-gradient(-45deg, #1c1c1c 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #1c1c1c 75%), 
        linear-gradient(-45deg, transparent 75%, #1c1c1c 75%);
      background-size: 8px 8px;
      background-position: 0 0, 0 4px, 4px -4px, -4px 0px;
      font-family: 'Press Start 2P', monospace;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* Klasik Piksel Panel (Sade ve Kompakt) */
    .mc-panel {
      background: #404040;
      border: 3px solid #141414;
      box-shadow: inset 3px 3px 0px #6e6e6e, inset -3px -3px 0px #1e1e1e, 0 8px 24px rgba(0,0,0,0.85);
      width: 100%;
      max-width: 480px;
    }

    /* Başlık */
    .mc-header {
      background: #2e2e2e;
      border-bottom: 3px solid #161616;
      padding: 18px 12px;
      text-align: center;
    }
    .mc-title {
      font-size: 14px;
      color: #ffff55;
      text-shadow: 2px 2px 0px #2a2a00, 3px 3px 0px #000000;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }
    .mc-subtitle {
      font-size: 7px;
      color: #888888;
      text-shadow: 1px 1px 0px #000000;
    }

    /* Sürüm Listesi */
    .mc-list {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 380px;
      overflow-y: auto;
      background: #2b2b2b;
    }
    .mc-list::-webkit-scrollbar {
      width: 8px;
    }
    .mc-list::-webkit-scrollbar-track {
      background: #1c1c1c;
      border-left: 2px solid #101010;
    }
    .mc-list::-webkit-scrollbar-thumb {
      background: #4a4a4a;
      border: 2px solid #101010;
      box-shadow: inset 1px 1px 0px #777777;
    }

    /* Sürüm Satırı */
    .mc-row {
      background: #383838;
      border: 2px solid #141414;
      box-shadow: inset 2px 2px 0px #585858, inset -2px -2px 0px #1c1c1c;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }
    .mc-row:hover {
      background: #444444;
      border-color: #ffffff;
    }

    /* Blok İkonu */
    .mc-icon {
      width: 24px;
      height: 24px;
      min-width: 24px;
      border: 2px solid #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }
    .icon-grass { background: #55a832; }
    .icon-stone { background: #666666; }

    .mc-info {
      flex: 1;
      min-width: 0;
    }
    .mc-ver-title {
      font-size: 8px;
      color: #ffffff;
      text-shadow: 1px 1px 0px #000000;
      margin-bottom: 4px;
    }
    .mc-ver-file {
      font-size: 6.5px;
      color: #888888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Yeşil Piksel Oyna Butonu */
    .mc-btn-play {
      font-family: 'Press Start 2P', monospace;
      font-size: 7.5px;
      padding: 8px 12px;
      cursor: pointer;
      border: 2px solid #101010;
      outline: none;
      image-rendering: pixelated;
      background: #2e7d32;
      box-shadow: inset 2px 2px 0px #52a356, inset -2px -2px 0px #174a1a;
      color: #ffffff;
    }
    .mc-btn-play:hover {
      background: #388e3c;
    }
    .mc-btn-play:active {
      transform: translate(1px, 1px);
      box-shadow: inset 2px 2px 0px #174a1a, inset -2px -2px 0px #52a356;
    }

    /* Boş Durum Metni */
    .mc-empty {
      padding: 36px 16px;
      text-align: center;
      font-size: 7px;
      color: #777777;
      line-height: 2;
    }

    /* Alt Durum Çubuğu */
    .mc-footer {
      padding: 8px 12px;
      background: #222222;
      border-top: 2px solid #161616;
      font-size: 6px;
      color: #666666;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="mc-panel">
    
    <!-- Sade Başlık -->
    <div class="mc-header">
      <div class="mc-title">MOOCRAFT</div>
      <div class="mc-subtitle">Sürüm Seçici</div>
    </div>

    <!-- Sürüm Listesi (Sadece GitHub/Klasörde dosya olduğunda dolar) -->
    <div id="versionList" class="mc-list">
      <div class="mc-empty">
        Henüz sürüm bulunamadı.<br>
        GitHub reponuza moocraft*.html dosyaları<br>
        eklediğinizde otomatik burada görünecektir.
      </div>
    </div>

    <!-- Alt Bilgi -->
    <div class="mc-footer" id="footerText">
      MooCraft • Otomatik Algılama
    </div>

  </div>

  <script>
    // ============================================================
    // MOOCRAFT SÜRÜM SEÇİCİ (100% OTOMATİK & SADE)
    // ============================================================
    // Kendimiz elle sürüm yazmıyoruz.
    // GitHub reponuza moocraft*.html dosyası koyduğunuzda
    // otomatik algılar, büyükten küçüğe sıralar ve listeler.

    // Dosya adından sürüm numarasını ve başlığını ayıkla
    // Örnek: "moocraft1.1.html" -> version: "1.1", name: "MooCraft 1.1"
    function parseVersion(filename) {
      const base = filename.replace(/\.[^/.]+$/, '').trim();
      const match = base.match(/(?:moocraft[_-]?(?:v)?)?([0-9]+(?:\.[0-9]+)*)/i);
      if (match && match[1]) {
        return {
          version: match[1],
          name: `MooCraft ${match[1]}`,
          file: filename
        };
      }
      return {
        version: '1.0',
        name: 'MooCraft',
        file: filename
      };
    }

    // Akıllı Sürüm Sıralaması (En yeni sürüm en üstte: 26.3 > 2.0 > 1.2 > 1.1 > 1.0)
    function compareVersions(vA, vB) {
      const parseNums = (str) => {
        const m = String(str).match(/[0-9]+(?:\.[0-9]+)*/);
        if (!m) return [0];
        return m[0].split('.').map(n => parseInt(n, 10) || 0);
      };

      const pA = parseNums(vA.version || vA.file);
      const pB = parseNums(vB.version || vB.file);
      const maxLen = Math.max(pA.length, pB.length);

      for (let i = 0; i < maxLen; i++) {
        const nA = pA[i] || 0;
        const nB = pB[i] || 0;
        if (nA !== nB) {
          return nB - nA; // Büyük sürüm üstte
        }
      }
      return vA.file.localeCompare(vB.file);
    }

    // Listeyi Ekrana Çiz
    function render(versions) {
      const container = document.getElementById('versionList');
      const footer = document.getElementById('footerText');
      if (!container) return;

      if (!versions || versions.length === 0) {
        container.innerHTML = `
          <div class="mc-empty">
            Henüz sürüm bulunamadı.<br><br>
            GitHub reponuza <strong>moocraft*.html</strong> dosyaları<br>
            eklediğinizde otomatik burada görünecektir.
          </div>
        `;
        if (footer) footer.textContent = 'MooCraft • 0 Sürüm';
        return;
      }

      container.innerHTML = '';
      versions.sort(compareVersions);

      if (footer) {
        footer.textContent = `Toplam ${versions.length} Sürüm Bulundu`;
      }

      versions.forEach((ver, index) => {
        const row = document.createElement('div');
        row.className = 'mc-row';

        const isLatest = (index === 0);
        const iconClass = isLatest ? 'icon-grass' : 'icon-stone';
        const iconChar = isLatest ? '🟩' : '🧱';

        row.innerHTML = `
          <div style="display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;">
            <div class="mc-icon ${iconClass}">
              <span>${iconChar}</span>
            </div>
            <div class="mc-info">
              <div class="mc-ver-title">${escapeHtml(ver.name)}</div>
              <div class="mc-ver-file">${escapeHtml(ver.file)}</div>
            </div>
          </div>
          <div>
            <button class="mc-btn-play btn-play" type="button" data-file="${escapeHtml(ver.file)}">
              OYNA ▶
            </button>
          </div>
        `;

        const btnPlay = row.querySelector('.btn-play');
        if (btnPlay) {
          btnPlay.onclick = (e) => {
            e.stopPropagation();
            window.location.href = ver.file;
          };
        }

        row.onclick = () => {
          window.location.href = ver.file;
        };

        container.appendChild(row);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // 1. OTOMATİK GITHUB REPO TARAYICI
    // GitHub Pages (username.github.io/reponame) üzerinde çalışırken reponun dosya listesini API ile çeker
    async function fetchGitHubFiles() {
      const host = window.location.hostname;
      let owner = '';
      let repo = '';

      if (host.endsWith('github.io')) {
        owner = host.split('.')[0];
        const parts = window.location.pathname.split('/').filter(Boolean);
        repo = parts[0] || '';
      }

      // Test için URL parametresi desteği: ?repo=kullanici/repo
      const params = new URLSearchParams(window.location.search);
      if (params.has('repo')) {
        const p = params.get('repo').split('/');
        if (p.length === 2) {
          owner = p[0];
          repo = p[1];
        }
      }

      if (!owner || !repo) return null;

      try {
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`);
        if (!res.ok) return null;
        const data = await res.json();
        if (!Array.isArray(data)) return null;

        return data
          .filter(item => item.type === 'file' && item.name.toLowerCase().endsWith('.html'))
          .map(item => item.name)
          .filter(name => {
            const l = name.toLowerCase();
            return l.includes('moocraft') && !l.includes('index') && !l.includes('secici');
          });
      } catch (e) {
        return null;
      }
    }

    // 2. OTOMATİK VERSIONS.JSON VEYA YEREL KLASÖR KONTROLÜ
    async function fetchLocalManifest() {
      try {
        const res = await fetch('versions.json');
        if (res.ok) {
          const list = await res.json();
          if (Array.isArray(list)) return list;
        }
      } catch(e) {}
      return null;
    }

    // BAŞLATMA: Sadece GitHub veya klasördeki gerçek dosyaları getir
    (async function init() {
      // 1. GitHub Repo kontrolü
      const ghFiles = await fetchGitHubFiles();
      if (ghFiles && ghFiles.length > 0) {
        const parsed = ghFiles.map(fn => parseVersion(fn));
        render(parsed);
        return;
      }

      // 2. versions.json manifest kontrolü
      const localFiles = await fetchLocalManifest();
      if (localFiles && localFiles.length > 0) {
        const parsed = localFiles.map(item => typeof item === 'string' ? parseVersion(item) : item);
        render(parsed);
        return;
      }

      // 3. Şu an bir yere koyulmadığı için listeyi BOŞ bırak (sahte sürüm yazma)
      render([]);
    })();
  </script>
</body>
</html>
